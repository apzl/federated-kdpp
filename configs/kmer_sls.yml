# Unchanged non-private pooled-context SLS baseline, at selected gamma 0.25.
# Only kmer_length is replaced by the length sweep. Defaults elsewhere stay intact.
data:
  alphabet: ACGT
  kmer_length: 6
  global_collection_size: 1000
partition:
  num_clients: 10
selection:
  forced_set_size: 10
  client_selection_size: 20
  final_selection_size: 100
  final_objective: pooled_context
kernel:
  name: hamming_rbf
  gamma: 0.25
  jitter: 0.0
search:
  algorithm: stochastic_local_search
  patience: 50
  improvement_tolerance: 1.0e-10
  max_iterations: null
  initialization: paired_uniform
numerics:
  symmetry_tolerance: 1.0e-12
  psd_tolerance: 1.0e-10
experiment:
  seed: 42
  repetitions: 3
output:
  directory: ../results
  save_history: true
  save_chain: false
