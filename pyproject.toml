[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fed-skdpp"
version = "0.1.0"
description = "Reproducible centralized and distributed k-mer diversity experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6.0"]

[project.optional-dependencies]
dppy = ["dppy>=0.3.3"]
test = ["pytest>=7"]
plot = ["matplotlib>=3.7"]
mpc = ["mpyc>=0.11,<0.12", "gmpy2>=2.2,<3"]

[project.scripts]
fed-skdpp-numpy = "fed_skdpp.cli:numpy_main"
fed-skdpp-dppy = "fed_skdpp.cli:dppy_main"
fed-skdpp-client-sweep = "fed_skdpp.sweep_cli:main"
fed-skdpp-variable-pool = "fed_skdpp.variable_pool_cli:main"
fed-skdpp-centralized-pool = "fed_skdpp.centralized_pool_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
